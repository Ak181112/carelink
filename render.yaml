services:
  - type: web
    name: carelinkplus-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_ROUTES_API_KEY
        sync: false
      - key: GOOGLE_CLOUD_VISION_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CURRENCY
        value: lkr
      - key: ADMIN_SERVICE_FEE_PERCENT
        value: 15
      - key: ENABLE_FREE_MAP_FALLBACK
        value: "false"
      - key: HOSPITAL_SEARCH_RADIUS_M
        value: 10000
      - key: OSM_USER_AGENT
        value: CareLinkPlus/1.0
      - key: GOOGLE_ROUTES_TIMEOUT_MS
        value: 15000
      - key: GOOGLE_ROUTES_MAX_RETRIES
        value: 2
      - key: REQUIRE_GOOGLE_ROUTES_FOR_PRICING
        value: "true"